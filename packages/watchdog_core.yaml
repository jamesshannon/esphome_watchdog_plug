safe_mode:

preferences:
  flash_write_interval: 0s

logger:
  level: DEBUG
  logs:
    component: NONE
    esp-idf: WARN
    sensor: INFO

api:
  id: api_component
  reboot_timeout: 0s
  actions:
    - action: power_cycle
      then:
        - script.execute:
            id: request_power_cycle
            reason: "api"
            automatic: false
            allow_self_reboot_preflight: false

ota:
  platform: esphome
  password: !secret ota_password

captive_portal:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  ap:
    ssid: "Plug-Pm-1 Fallback Hotspot"
    password: !secret fallback_ap_password
    ap_timeout: 30min

http_request:
  # The request runs synchronously on the main loop. watchdog_timeout must stay
  # above timeout so a slow DNS or connect phase cannot trip the 10s task watchdog.
  timeout: 10s
  watchdog_timeout: 30s
